services:
  php-apache:
    build: .
    container_name: ieb_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_NAME: ieb_site
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - ieb-network

  db:
    image: mysql:8.4
    container_name: ieb_db
    restart: always
    environment:
      MYSQL_DATABASE: ieb_site
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./ieb_site.sql:/docker-entrypoint-initdb.d/ieb_site.sql:ro
    networks:
      - ieb-network

volumes:
  db_data:

networks:
  ieb-network:
    driver: bridge